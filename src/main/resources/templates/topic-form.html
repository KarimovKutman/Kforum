<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая тема — Kforum</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page-content narrow-content">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <a class="back-link" th:href="@{/}">← На главную</a>
    <section class="page-heading"><p class="eyebrow">ТВОЯ ИДЕЯ ИМЕЕТ ЗНАЧЕНИЕ</p><h1>Создать тему</h1><p>Сформулируй вопрос или начни новое обсуждение.</p></section>
    <form class="form-panel" th:action="@{/topics}" method="post">
        <div class="form-field"><label for="title">Заголовок</label><input id="title" name="title" type="text" maxlength="200" placeholder="О чём хочешь поговорить?" required></div>
        <div class="form-field"><label for="categoryId">Категория</label><select id="categoryId" name="categoryId" required><option value="" disabled selected>Выбери категорию</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Категория</option></select><span class="field-hint" th:if="${#lists.isEmpty(categories)}">Категорий пока нет. Попроси администратора создать категорию.</span></div>
        <div class="form-field"><label for="content">Текст темы</label><textarea id="content" name="content" rows="9" maxlength="20000" placeholder="Добавь контекст, детали или то, что уже пробовал…" required></textarea></div>
        <div class="form-footer"><span class="field-hint">Перед публикацией проверь заголовок и текст.</span><button class="button button-primary" type="submit" th:disabled="${#lists.isEmpty(categories)}">Опубликовать тему ↗</button></div>
    </form>
</main>
<footer class="site-footer"><div class="container footer-inner"><a class="brand" th:href="@{/}">Kforum<span>.</span></a><p>Обсуждай то, что важно.</p><span>© Kforum</span></div></footer>
    <script th:src="@{/js/app.js}" defer></script>
</body>
</html>
